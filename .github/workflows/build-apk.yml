
name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build variant (both, release, or debug)'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - release
          - debug

permissions:
  contents: write

jobs:
  build:
    name: Build SogoSocial Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web application with test ads
        run: npm run build
        env:
          VITE_USE_LIVE_ADS: 'false'
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || secrets.FIREBASE_API_KEY || 'AIzaSyA7XXZaXGrs6g4La5lkd3Vil8AJSUXTlek' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || secrets.FIREBASE_AUTH_DOMAIN || 'sogo-e5ea9.firebaseapp.com' }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || secrets.FIREBASE_PROJECT_ID || 'sogo-e5ea9' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || secrets.FIREBASE_STORAGE_BUCKET || 'sogo-e5ea9.firebasestorage.app' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || secrets.FIREBASE_MESSAGING_SENDER_ID || '1035132864845' }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || secrets.FIREBASE_APP_ID || '1:1035132864845:web:6508bc026762f4887f8f04' }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID || 'G-7FCKN828JC' }}
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID || '1035132864845-ulhcdqfeknujp5mc1naj6vhrujqc828t.apps.googleusercontent.com' }}
          VITE_PUBLIC_APP_URL: ${{ secrets.VITE_PUBLIC_APP_URL || 'https://sogo-e5ea9.web.app' }}

      - name: Configure Android Google Services if secret provided
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK 36
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a578e440d4532a7ff0482524587" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" || true

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Android Debug Keystore
        run: |
          if [ -z "$DEBUG_KEYSTORE_HEX" ]; then
            echo "::error::DEBUG_KEYSTORE_HEX secret is not set."
            echo ""
            echo "A persistent debug keystore is REQUIRED so the APK's signing SHA-1 stays the"
            echo "same on every build. Without it, Google Sign-In may fail because the SHA-1"
            echo "registered in Firebase / Google Cloud Console no longer matches the APK."
            echo ""
            echo "This workflow will NOT generate a new random keystore."
            echo "Set DEBUG_KEYSTORE_HEX in Settings > Secrets and variables > Actions."
            exit 1
          fi

          echo "Restoring persistent debug keystore..."
          python3 -c '
          import os, binascii
          hex_str = os.environ.get("DEBUG_KEYSTORE_HEX", "").strip()
          keystore_bytes = binascii.unhexlify(hex_str)
          with open("android/app/debug.keystore", "wb") as f:
              f.write(keystore_bytes)
          '

          echo "=== Debug Keystore Diagnostics ==="
          ls -lh android/app/debug.keystore
          wc -c android/app/debug.keystore

          if ! keytool -list -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey; then
            echo "::error::Unable to read debug keystore. Check DEBUG_KEYSTORE_HEX."
            exit 1
          fi
        env:
          DEBUG_KEYSTORE_HEX: ${{ secrets.DEBUG_KEYSTORE_HEX }}

      - name: Verify debug keystore SHA-1 matches expected fingerprint
        run: |
          EXPECTED_SHA1="2D:64:F8:A0:16:5D:15:18:A1:FF:6E:5E:0D:B7:77:B4:86:AA:7F:70"
          ACTUAL_SHA1=$(keytool -list -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey | grep "SHA1:" | awk '{print $2}')
          echo "Expected SHA-1: $EXPECTED_SHA1"
          echo "Actual   SHA-1: $ACTUAL_SHA1"
          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::Debug keystore SHA-1 does not match the expected fingerprint."
            exit 1
          fi
          echo "Debug keystore SHA-1 matches the expected fingerprint."

      - name: Make Gradlew Executable
        run: chmod +x ./android/gradlew

      - name: Build Android Debug APK
        if: github.event_name != 'workflow_dispatch' || inputs.build_type != 'release'
        run: ./android/gradlew assembleDebug --stacktrace --no-daemon

      - name: Rebuild web app with live ads for release AAB
        if: github.event_name == 'workflow_dispatch' && (inputs.build_type == 'release' || inputs.build_type == 'both')
        run: |
          npm run build
          npx cap sync android
        env:
          VITE_USE_LIVE_ADS: 'true'
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || secrets.FIREBASE_API_KEY || 'AIzaSyA7XXZaXGrs6g4La5lkd3Vil8AJSUXTlek' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || secrets.FIREBASE_AUTH_DOMAIN || 'sogo-e5ea9.firebaseapp.com' }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || secrets.FIREBASE_PROJECT_ID || 'sogo-e5ea9' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || secrets.FIREBASE_STORAGE_BUCKET || 'sogo-e5ea9.firebasestorage.app' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || secrets.FIREBASE_MESSAGING_SENDER_ID || '1035132864845' }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || secrets.FIREBASE_APP_ID || '1:1035132864845:web:6508bc026762f4887f8f04' }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID || 'G-7FCKN828JC' }}
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID || '1035132864845-ulhcdqfeknujp5mc1naj6vhrujqc828t.apps.googleusercontent.com' }}
          VITE_PUBLIC_APP_URL: ${{ secrets.VITE_PUBLIC_APP_URL || 'https://sogo-e5ea9.web.app' }}

      - name: Build Signed Android Release AAB
        if: github.event_name == 'workflow_dispatch' && (inputs.build_type == 'release' || inputs.build_type == 'both')
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$RELEASE_STORE_PASSWORD" ] || [ -z "$RELEASE_KEY_ALIAS" ] || [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "::error::Missing release signing secrets."
            exit 1
          fi

          export RELEASE_KEYSTORE_FILE="$RUNNER_TEMP/sogo-upload-key.jks"
          python3 -c '
          import os, base64
          b64_str = "".join(os.environ.get("RELEASE_KEYSTORE_BASE64", "").split())
          raw = base64.b64decode(b64_str)
          out_path = os.environ["RELEASE_KEYSTORE_FILE"]
          with open(out_path, "wb") as f:
              f.write(raw)
          os.chmod(out_path, 0o600)
          '

          ./android/gradlew bundleRelease --stacktrace --no-daemon

          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB_PATH" ]; then
            echo "::error::Expected release AAB not found at $AAB_PATH"
            exit 1
          fi
          ls -lh "$AAB_PATH"
          jarsigner -verify "$AAB_PATH"

      - name: Clean Up Temporary Release Keystore
        if: always() && github.event_name == 'workflow_dispatch' && (inputs.build_type == 'release' || inputs.build_type == 'both')
        run: rm -f "$RUNNER_TEMP/sogo-upload-key.jks"

      - name: Publish Build Files to GitHub Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_TYPE: ${{ inputs.build_type }}
          BUILD_TAG: sogo-build-${{ github.run_number }}
          BUILD_TITLE: SogoSocial Build ${{ github.run_number }}
        run: |
          FILES=()

          if [ "$BUILD_TYPE" = "debug" ] || [ "$BUILD_TYPE" = "both" ]; then
            FILES+=("android/app/build/outputs/apk/debug/app-debug.apk")
          fi

          if [ "$BUILD_TYPE" = "release" ] || [ "$BUILD_TYPE" = "both" ]; then
            FILES+=("android/app/build/outputs/bundle/release/app-release.aab")
          fi

          for file in "${FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::Expected build file not found: $file"
              exit 1
            fi
          done

          gh release create "$BUILD_TAG" "${FILES[@]}" \
            --title "$BUILD_TITLE" \
            --notes "SogoSocial build created by GitHub Actions run $GITHUB_RUN_NUMBER." \
            --target "$GITHUB_SHA"

      - name: Release APK on version tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
